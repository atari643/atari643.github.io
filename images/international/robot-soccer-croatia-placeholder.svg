<!-- SVG Placeholder pour robot-soccer-croatia.jpg -->
<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ea1ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad1)"/>
  
  <!-- Grid pattern -->
  <g stroke="rgba(255,255,255,0.1)" stroke-width="1">
    <line x1="0" y1="168.75" x2="1200" y2="168.75"/>
    <line x1="0" y1="337.5" x2="1200" y2="337.5"/>
    <line x1="0" y1="506.25" x2="1200" y2="506.25"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
  </g>
  
  <!-- Robot icon simplified -->
  <g transform="translate(450, 200)">
    <!-- Robot body -->
    <rect x="50" y="80" width="200" height="180" rx="20" fill="rgba(255,255,255,0.9)"/>
    <!-- Robot head -->
    <rect x="85" y="30" width="130" height="70" rx="15" fill="rgba(255,255,255,0.9)"/>
    <!-- Eyes -->
    <circle cx="120" cy="55" r="12" fill="#4ea1ff"/>
    <circle cx="180" cy="55" r="12" fill="#4ea1ff"/>
    <!-- Antenna -->
    <line x1="150" y1="30" x2="150" y2="5" stroke="rgba(255,255,255,0.9)" stroke-width="4"/>
    <circle cx="150" cy="5" r="8" fill="#ff4e4e"/>
    <!-- Arms -->
    <rect x="10" y="100" width="50" height="80" rx="10" fill="rgba(255,255,255,0.8)"/>
    <rect x="240" y="100" width="50" height="80" rx="10" fill="rgba(255,255,255,0.8)"/>
    <!-- Legs/Wheels -->
    <circle cx="100" cy="280" r="30" fill="rgba(30,30,30,0.8)"/>
    <circle cx="200" cy="280" r="30" fill="rgba(30,30,30,0.8)"/>
  </g>
  
  <!-- Soccer ball -->
  <g transform="translate(700, 350)">
    <circle cx="0" cy="0" r="50" fill="white"/>
    <path d="M0,-50 L15,-20 L-15,-20 Z" fill="black"/>
    <path d="M-48,-12 L-25,-30 L-15,-5 Z" fill="black"/>
    <path d="M-30,40 L-15,15 L15,15 Z" fill="black"/>
    <path d="M48,-12 L25,-30 L15,-5 Z" fill="black"/>
    <path d="M30,40 L15,15 L45,20 Z" fill="black"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="550" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">
    🏆 Robot Soccer Competition
  </text>
  <text x="600" y="590" font-family="Arial, sans-serif" font-size="28" fill="rgba(255,255,255,0.9)" text-anchor="middle">
    European Cup 2023 - Croatia
  </text>
  <text x="600" y="630" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)" text-anchor="middle">
    🥈 2nd Place
  </text>
  
  <!-- Placeholder notice -->
  <rect x="20" y="20" width="400" height="50" rx="10" fill="rgba(0,0,0,0.5)"/>
  <text x="220" y="50" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">
    📸 Placeholder - Remplacer par votre photo
  </text>
</svg>
